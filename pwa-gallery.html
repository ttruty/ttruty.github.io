<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Showcase</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .gallery-header {
            text-align: center;
            padding: 40px 20px 20px;
            color: #333;
        }

        /* The core grid layout */
        .pwa-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Individual app card styling */
        .pwa-card {
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pwa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* App icon styling */
        .pwa-icon {
            width: 80px;
            height: 80px;
            border-radius: 22.5%; /* Mimics iOS app icon squircle */
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #eee;
        }

        .pwa-title {
            font-size: 1.25rem;
            margin: 0 0 10px;
            color: #111;
        }

        .pwa-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
            flex-grow: 1; /* Pushes the button to the bottom */
        }

        .pwa-link {
            display: inline-block;
            padding: 10px 24px;
            background-color: #007aff; /* System blue */
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .pwa-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="gallery-header">
    <h1>Progressive Web Apps</h1>
    <p>A collection of my web applications</p>
</div>

<div class="pwa-gallery">
    <!-- Card 1 -->
    <div class="pwa-card">
        <img src="assets/pwa/yarnbeard.png" alt="Audiobook Player Icon" class="pwa-icon">
        <h2 class="pwa-title">Audiobook Player</h2>
        <p class="pwa-desc">An Ionic Angular progressive web app with custom playback speed controls and a folder-based library and google drive integration.</p>
        <a href="http://timtruty.com/gdrive-audio-book-player/" target="_blank" class="pwa-link">Yarnbeard App</a>
    </div>
    
    <!-- Card 2 -->
    <div class="pwa-card">
        <img src="assets/pwa/cando.png" alt="Cando Icon" class="pwa-icon">
        <h2 class="pwa-title">Random Reminder</h2>
        <p class="pwa-desc">Random Reminders and certain intervals.</p>
        <a href="http://timtruty.com/RANDOM-REMINDER/" target="_blank" class="pwa-link">Rando Cando</a>
    </div>

    <!-- Add more .pwa-card blocks as needed -->
</div>

</body>
</html>
